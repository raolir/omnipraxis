name: Build Windows desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.3.0
          runtime: node@24
          cache: true
          install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build web app
        run: pnpm build

      - name: Build desktop executable
        run: pnpm desktop:build

      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/windows-portable/Omnipraxis"
          Copy-Item "src-tauri/target/release/Omnipraxis.exe" "build/windows-portable/Omnipraxis/Omnipraxis.exe"
          Copy-Item "public/scenes/base/splats.spz" "build/windows-portable/Omnipraxis/splats.spz"
          Copy-Item "public/scenes/base/colliders.glb" "build/windows-portable/Omnipraxis/colliders.glb"

      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: omnipraxis-windows-x64
          path: build/windows-portable
          if-no-files-found: error
