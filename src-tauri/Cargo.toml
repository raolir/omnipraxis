[package]
name = "omnipraxis-desktop"
version = "0.0.0"
description = "Omnipraxis desktop runtime"
edition = "2024"

[lib]
name = "omnipraxis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
